	function updateFavicon(isDark) {
		const color = isDark ? '#ffffff' : '#000000';
		const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,15.36 90,84.64 10,84.64" fill="${color}" /></svg>`;
		const link = document.getElementById('siteFavicon');
		if (link) {
			link.href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
		}
	}

	function applyTheme(theme) {
		const isDark = theme === 'dark';
		if (isDark) {
			document.documentElement.classList.add('dark');
		} else {
			document.documentElement.classList.remove('dark');
		}
		updateFavicon(isDark);
	}

	// 1. 初始化：優先依據儲存偏好，若未曾手動設定則自動遵循系統偏好
	const savedTheme = localStorage.getItem('theme');
	const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
	const currentTheme = savedTheme || (systemDark ? 'dark' : 'light');

	applyTheme(currentTheme);

	// 2. 監聽作業系統深淺色變化（若使用者尚未手動固定設定）
	window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
		if (!localStorage.getItem('theme')) {
			applyTheme(e.matches ? 'dark' : 'light');
		}
	});

	// 3. 全域主題切換 API（供按鈕長按呼叫）
	window.__toggleTheme = function () {
		const isDark = document.documentElement.classList.toggle('dark');
		const newTheme = isDark ? 'dark' : 'light';
		localStorage.setItem('theme', newTheme);
		updateFavicon(isDark);
		return isDark;
	};
